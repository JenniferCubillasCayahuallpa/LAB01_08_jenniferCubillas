name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - main

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build ms-productos JAR
        run: mvn clean package -DskipTests
        working-directory: ms-productos

      - name: Build ms-pedidos JAR
        run: mvn clean package -DskipTests
        working-directory: ms-pedidos

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push ms-productos image
        uses: docker/build-push-action@v5
        with:
          context: ./ms-productos
          push: true
          tags: jenniferalejandra/ms-productos:latest

      - name: Build & push ms-pedidos image
        uses: docker/build-push-action@v5
        with:
          context: ./ms-pedidos
          push: true
          tags: jenniferalejandra/ms-pedidos:latest

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy ms-productos
        run: |
          kubectl apply -f k8s/ms-productos-deployment.yaml
          kubectl apply -f k8s/ms-productos-service.yaml

      - name: Deploy ms-pedidos
        run: |
          kubectl apply -f k8s/ms-pedidos-deployment.yaml
          kubectl apply -f k8s/ms-pedidos-service.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/ms-productos
          kubectl rollout status deployment/ms-pedidos
